<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>本地记账</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#1463d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;color:#18202a;margin:0;padding:22px;max-width:720px;margin:auto}body{padding-bottom:max(22px,env(safe-area-inset-bottom));overflow-wrap:anywhere}h1{font-size:26px}section{background:white;border-radius:16px;padding:16px;margin:16px 0;box-shadow:0 2px 12px #0001}input,select,button{box-sizing:border-box;font-size:16px;padding:11px;border-radius:9px;border:1px solid #ddd;margin:5px 0;width:100%}button{background:#1463d8;color:white;border:0;font-weight:600}button.secondary{background:#e9eef6;color:#183b70}button.danger{background:#fce7e7;color:#a11}label{font-size:13px;color:#536070}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 4px;text-align:left;border-bottom:1px solid #eee}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.muted{color:#6b7280;font-size:13px}.amount{font-weight:700}#status{white-space:pre-wrap}</style></head><body><h1>📒 本地记账</h1><p class="muted">版本 3 · 快捷指令自动导入</p><p class="muted">数据保存在当前浏览器的 IndexedDB 中；请定期导出备份。</p><section><h2>新增记录</h2><form id="form"><div class="row"><div><label>金额</label><input id="amount" type="number" step="0.01" min="0.01" required placeholder="12.50"></div><div><label>收支</label><select id="type"><option value="expense">支出</option><option value="income">收入</option><option value="refund">退款</option></select></div></div><label>商户</label><input id="merchant" placeholder="例如 瑞幸咖啡"><div class="row"><div><label>分类</label><select id="category"></select></div><div><label>支付方式</label><input id="payment_method" placeholder="微信支付"></div></div><label>交易时间</label><input id="transaction_time" type="datetime-local" required><button>保存记录</button></form></section><section><h2>JSON 导入</h2><textarea id="json" style="font-size:16px;box-sizing:border-box;width:100%;height:120px;border:1px solid #ddd;border-radius:9px;padding:10px" placeholder='{"amount":12.5,"merchant":"瑞幸咖啡","category":"餐饮","type":"expense","payment_method":"微信支付","transaction_time":"2026-10-23 12:30"}'></textarea><button id="importJson">导入 JSON</button><p class="muted">支持单条 JSON、JSON 数组或 JSONL（每行一条）。</p></section><section><h2>本月统计</h2><div id="summary">加载中…</div></section><section><h2>交易记录</h2><div class="row"><button class="secondary" id="export" type="button">导出 JSON 备份</button><button class="secondary" id="exportCsv" type="button">导出 CSV</button></div><input type="file" id="file" accept=".json,.jsonl,application/json,text/plain" style="margin-top:8px"><div style="overflow-x:auto"><table><thead><tr><th>时间</th><th>商户 / 分类</th><th>金额</th><th></th></tr></thead><tbody id="records"></tbody></table></div></section><p id="offlineStatus" class="muted" role="status">正在准备离线缓存…</p><p id="status" class="muted" role="status" aria-live="polite"></p><script>
const DB='local-ledger',STORE='transactions';let db;let pendingDelete=null;const $=id=>document.getElementById(id);const categories=['餐饮','购物','交通','住房','生活缴费','娱乐','医疗','教育','旅行','通讯','工资','转账','其他'];$('category').innerHTML=categories.map(x=>`<option>${x}</option>`).join('');const now=new Date();$('transaction_time').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);const notify=s=>{$('status').textContent=s};
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{let s=q.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('time','transaction_time')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function store(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function normalize(x){if(!x||x.valid===false)throw Error('不是有效交易');let amount=Number(x.amount);if(!Number.isFinite(amount)||amount<=0)throw Error('金额必须大于0');let type=x.type||'expense';if(!['expense','income','refund'].includes(type))throw Error('未知收支类型');let t=String(x.transaction_time||'').replace('T',' ');if(!/^\d{4}-\d\d-\d\d \d\d:\d\d/.test(t))throw Error('交易时间缺失或格式不正确');return {amount,merchant:String(x.merchant||'未填写'),category:String(x.category||'其他'),type,payment_method:String(x.payment_method||''),currency:String(x.currency||'CNY'),transaction_time:t.slice(0,19)}}
function write(action){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');let result;tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(tx.error||Error('保存失败'));tx.onerror=()=>reject(tx.error);const request=action(tx.objectStore(STORE));request.onsuccess=()=>{result=request.result}})}async function add(x){const record=normalize(x);return write(s=>s.add(record))}async function all(){return req(store().getAll())}async function remove(id){return write(s=>s.delete(id))}function money(n){return '¥'+n.toFixed(2)}
async function render(){let arr=(await all()).sort((a,b)=>b.transaction_time.localeCompare(a.transaction_time));let month=new Date().toLocaleDateString('sv-SE').slice(0,7);let m=arr.filter(x=>x.transaction_time.startsWith(month));let sum=t=>m.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);let expense=sum('expense'),income=sum('income'),refund=sum('refund');let cats={};m.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);$('summary').innerHTML=`<p>支出 <b>${money(expense)}</b> · 收入 <b>${money(income)}</b> · 退款 <b>${money(refund)}</b></p><p>净支出 <b>${money(expense-refund-income)}</b></p><p class="muted">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${escapeHtml(k)} ${money(v)}`).join(' · ')||'暂无记录'}</p>`;$('records').innerHTML=arr.slice(0,150).map(x=>`<tr><td>${escapeHtml(x.transaction_time.slice(5,16))}</td><td>${escapeHtml(x.merchant)}<br><span class="muted">${escapeHtml(x.category)}</span></td><td class="amount">${x.type==='expense'?'-':'+'}${money(x.amount)}</td><td><button type="button" class="danger" style="padding:10px;min-height:44px" data-id="${x.id}">${pendingDelete===x.id?'确认删除':'删除'}</button>${pendingDelete===x.id?'<button type="button" class="secondary" data-cancel="true">取消</button>':''}</td></tr>`).join('')||'<tr><td colspan="4">暂无交易</td></tr>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parse(text){text=text.trim();try{let obj=JSON.parse(text);return Array.isArray(obj)?obj:[obj]}catch{return text.split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line))}}async function ingest(text){let arr=parse(text),ok=0,failed=0;for(let x of arr){try{await add(x);ok++}catch{failed++}}await render();notify(`导入成功 ${ok} 条，跳过 ${failed} 条`)}
$('form').onsubmit=async e=>{e.preventDefault();try{await add(Object.fromEntries(['amount','merchant','category','type','payment_method','transaction_time'].map(k=>[k,$(k).value])));await render();notify('已保存')}catch(e){notify(e.message)}};$('importJson').onclick=async()=>{try{await ingest($('json').value)}catch(e){notify('导入失败：'+e.message)}};$('records').onclick=async e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.cancel){pendingDelete=null;await render();return;}
 const id=Number(button.dataset.id);if(!Number.isSafeInteger(id)||id<=0)return;
 if(pendingDelete!==id){pendingDelete=id;await render();notify('请再次点击“确认删除”，或点击“取消”。');return;}
 button.disabled=true;
 try{await remove(id);pendingDelete=null;await render();notify('已删除记录')}catch(err){button.disabled=false;notify('删除失败：'+err.message)}
};function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('export').onclick=async()=>download(JSON.stringify(await all(),null,2),'ledger-backup.json','application/json');$('exportCsv').onclick=async()=>{let arr=await all(),keys=['transaction_time','amount','merchant','category','type','payment_method','currency'];download('\ufeff'+[keys.join(','),...arr.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),'ledger.csv','text/csv')};$('file').onchange=async e=>{let f=e.target.files[0];if(f)try{await ingest(await f.text())}catch(err){notify(err.message)}};const dbReady=openDB().then(d=>{db=d;return render()});
dbReady.catch(e=>notify('数据库不可用：'+e.message));
let incomingQueue=Promise.resolve();
function receiveURL(){
 const url=new URL(location.href);
 const incoming=new URLSearchParams(url.hash.slice(1)).get('data')||url.searchParams.get('data');
 if(!incoming)return;
 // Capture and clear synchronously, so lifecycle events cannot import twice.
 url.hash='';url.searchParams.delete('data');history.replaceState(null,'',url.pathname+url.search);
 incomingQueue=incomingQueue.then(async()=>{
  await dbReady;$('json').value='';
  const records=parse(incoming).map(normalize);
  if(!records.length)throw Error('没有可导入的交易');
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(STORE,'readwrite');
   tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('导入已取消'));tx.onerror=()=>reject(tx.error);
   const objectStore=tx.objectStore(STORE);records.forEach(record=>objectStore.add(record));
  });
  await render();notify(`快捷指令已自动记账 ${records.length} 条`);
 }).catch(err=>{ $('json').value=incoming;notify('自动导入失败：'+err.message+'；原始内容已放入导入框，可修正后重试。')});
}
window.addEventListener('hashchange',receiveURL);
window.addEventListener('pageshow',receiveURL);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')receiveURL()});
receiveURL();
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(async reg=>{
  const cache=await caches.open('ai-ledger-'+reg.scope+'v4');
  const paths=['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./tabs.css','./tabs.js'];
  const found=await Promise.all(paths.map(path=>cache.match(new URL(path,reg.scope).href)));
  $('offlineStatus').textContent=found.every(Boolean)?'版本 4 离线资源已就绪（7/7），可断网使用；数据仅保存在本机。':'离线缓存尚未完整，请联网重新打开。';
 }).catch(e=>{$('offlineStatus').textContent='离线缓存不可用：'+e.message});
} else {$('offlineStatus').textContent='当前浏览器不支持离线缓存。'}
</script><link rel="stylesheet" href="./tabs.css"><script src="./tabs.js"></script></body></html>
